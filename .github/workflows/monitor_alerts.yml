name: Monitor Alerts TradingView Pro

on:
  schedule:
    - cron: "5 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run alert scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_alerts_pro.py

      - name: Commit updated alerts JSON
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add alerts_geometrici_v2.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Disarmati alert scattati" && git push)
